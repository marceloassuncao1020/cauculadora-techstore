<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora TechStore</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <main class="container">
        <header>
            <h1>Calculadora TechStore</h1>
            <p>Simulador dinâmico de orçamento</p>
        </header>

        <form id="form-orcamento">
            <div class="campo">
                <label for="valor-produto">Valor do Produto (R$):</label>
                <input type="number" id="valor-produto" step="0.01" min="0.01" placeholder="Ex: 100.00" required>
            </div>

            <div class="campo">
                <label for="forma-pagamento">Forma de Pagamento:</label>
                <select id="forma-pagamento" required>
                    <option value="">Selecione...</option>
                    <option value="pix">PIX (15% de desconto)</option>
                    <option value="boleto">Boleto (10% de desconto)</option>
                    <option value="cartao-vista">Cartão à Vista (5% de desconto)</option>
                    <option value="cartao-parcelado">Cartão Parcelado (Sem desconto)</option>
                </select>
            </div>

            <div class="campo">
                <label for="tipo-entrega">Modalidade de Frete:</label>
                <select id="tipo-entrega" required>
                    <option value="">Selecione...</option>
                    <option value="retirada">Retirada na Loja (R$ 0,00)</option>
                    <option value="padrao">Entrega Padrão (R$ 12,00)</option>
                    <option value="expressa">Expressa (R$ 25,00)</option>
                    <option value="super-expressa">Super Expressa (R$ 45,00)</option>
                </select>
            </div>

            <button type="submit">Calcular Orçamento</button>
        </form>

        <section id="painel-resultado" class="resultado hidden">
            <h2>Resumo do Orçamento</h2>
            <ul>
                <li><span>Valor Original:</span> <strong id="res-valor-produto">R$ 0,00</strong></li>
                <li><span>Desconto Aplicado:</span> <strong id="res-desconto" class="desconto">- R$ 0,00</strong></li>
                <li><span>Valor do Frete:</span> <strong id="res-frete">+ R$ 0,00</strong></li>
                <li class="total"><span>Total Final:</span> <strong id="res-total">R$ 0,00</strong></li>
            </ul>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>
</html>
